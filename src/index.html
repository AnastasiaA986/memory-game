<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="game-info">
        <h1 class="title">Memory Game</h1>

        <!-- ÉCRAN DE DÉPART : choix du niveau + bouton Commencer -->
        <div class="start-screen">
          <div class="level">
            <div class="level-choice">
              <button class="level-button" data-level="facile">Facile</button>
              <button class="level-button" data-level="difficile">
                Difficile
              </button>
            </div>
            <p class="level-hint">Choisissez un niveau</p>
          </div>

          <button class="start-button" disabled>Commencer →</button>
        </div>

        <!-- ÉCRAN DE JEU : chip du niveau + stats + bouton Rejouer -->
        <div class="game-screen" hidden>
          <p class="level-chip">Facile · 12 cartes</p>

          <div class="stats">
            <!-- chrono : seulement en niveau difficile -->
            <div class="timer">
              <p class="stat-label">Temps</p>
              <p class="timer-value">00:00</p>
            </div>

            <div class="stat-row">
              <div class="stat">
                <p class="stat-label">Paires</p>
                <p class="stat-value pairs-value">0/6</p>
              </div>
              <div class="stat">
                <p class="stat-label">Coups</p>
                <p class="stat-value moves-value">0</p>
              </div>
            </div>
          </div>

          <button class="replay-button">Rejouer</button>
        </div>
      </div>
      <div id="board">
        <!-- voile + popup par-dessus les cartes -->
        <div class="memo-overlay" hidden>
          <div class="memo-popup">
            <p class="memo-popup-title">Mémorisez les cartes !</p>
            <p class="memo-popup-text">3 secondes pour tout retenir</p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
